# Keeps the pinned (locked) dependencies current, as reviewable pull requests. A new release must be
# a week old before it is proposed, so that a compromised release is more likely to be caught first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /.devcontainer/claude-code
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

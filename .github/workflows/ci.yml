# Runs the project's gates in the dev container image (built from .devcontainer/Dockerfile), so CI and
# local development use the same toolchain. Everything is pinned: actions by commit SHA (with the
# version in a comment; Dependabot keeps them current), the runner image, the container base image
# (by digest) and every dependency (by lockfile).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # (A run on main goes to the end: it is what the release is judged on.)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: emoji-selector-dev:ci

jobs:
  checks:
    name: Lint, format and tests (100% coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .devcontainer
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=devcontainer
          cache-to: type=gha,scope=devcontainer,mode=max
      - name: Run every pre-commit hook, then the project checks
        # The container user (uid 1000) must be able to write to the checkout. SKIP: committing to
        # main is what that hook forbids, and this run is not a commit.
        run: |
          chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm --volume "$GITHUB_WORKSPACE:/work" --workdir /work --env SKIP=no-commit-to-branch "$IMAGE" bash -euo pipefail -c '
            git config --global --add safe.directory /work
            npm ci
            pre-commit run --all-files --show-diff-on-failure
            npm run check
          '
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  mutation:
    name: Mutation testing (100% score)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .devcontainer
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=devcontainer
      - name: Run Stryker
        run: |
          chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm --volume "$GITHUB_WORKSPACE:/work" --workdir /work "$IMAGE" bash -euo pipefail -c '
            npm ci
            npm run test:mutation
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore

  ego-review:
    name: extensions.gnome.org review (shexli)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .devcontainer
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=devcontainer
      - name: Build the package and run shexli
        run: |
          chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm --volume "$GITHUB_WORKSPACE:/work" --workdir /work "$IMAGE" bash -euo pipefail -c '
            git config --global --add safe.directory /work
            npm ci
            npm run shexli
          '
      - name: Keep the package of a pull request, to try it out
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-package-pr-${{ github.event.pull_request.number }}
          path: dist/*.zip
          if-no-files-found: error

  real-gnome:
    name: Preferences and Shell in the real GNOME (Xvfb, headless Shell)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .devcontainer
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=devcontainer
      - name: Open the preferences, and run the built extension in a headless Shell
        run: |
          chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm --volume "$GITHUB_WORKSPACE:/work" --workdir /work "$IMAGE" bash -euo pipefail -c '
            git config --global --add safe.directory /work
            npm ci
            npm run test:real
          '
